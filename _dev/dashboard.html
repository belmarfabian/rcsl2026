<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RCSL 2026 — Dashboard Inscripciones</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #FF6B6B;
    --ink: #111;
    --muted: #777;
    --line: #ececec;
    --bg-soft: #fafafa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Work Sans', sans-serif;
    background: #fff;
    color: var(--ink);
    padding: 48px 32px 64px;
    min-height: 100vh;
    font-weight: 400;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header { margin-bottom: 40px; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.3px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .updated { font-size: 12px; color: var(--muted); margin-top: 12px; }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-bottom: 48px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .card { padding: 28px 24px; border-left: 1px solid var(--line); }
  .card:first-child { border-left: none; }
  .card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 500; }
  .card .num { font-size: 44px; font-weight: 300; line-height: 1.1; margin-top: 12px; letter-spacing: -1px; }
  .card .pct { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .card.ok .num { color: var(--accent); }
  .card.err .num { color: var(--ink); opacity: 0.4; }

  .progress { margin-bottom: 48px; }
  .progress h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 500; margin-bottom: 12px; }
  .bar { height: 4px; background: var(--bg-soft); overflow: hidden; }
  .bar-seg { height: 100%; transition: width 0.4s ease; }
  .bar-seg.ok { background: var(--accent); }
  .legend { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  .controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .controls input, .controls select {
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 0;
    font-family: inherit; font-size: 13px; background: #fff; color: var(--ink);
    outline: none; transition: border-color 0.15s;
  }
  .controls input:focus, .controls select:focus { border-color: var(--ink); }
  .controls input { flex: 1; min-width: 220px; }
  .row-count { color: var(--muted); font-size: 12px; margin-left: auto; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 12px 8px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  th { font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); cursor: pointer; user-select: none; white-space: nowrap; }
  th:hover { color: var(--ink); }
  tr:hover td { background: var(--bg-soft); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 0; font-size: 11px; font-weight: 500; white-space: nowrap; }
  .pill.yes { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .pill.no  { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .pill.gray { background: var(--bg-soft); color: var(--muted); }
  a.voucher { color: var(--accent); text-decoration: none; font-size: 12px; }
  a.voucher:hover { text-decoration: underline; }

  .empty { padding: 64px; text-align: center; color: var(--muted); font-size: 13px; }
  .config-hint { border-left: 2px solid var(--accent); padding: 16px 20px; margin-bottom: 32px; font-size: 13px; color: var(--ink); background: var(--bg-soft); }
  .config-hint code { background: #fff; padding: 2px 6px; font-size: 12px; font-family: monospace; }

  footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); text-align: center; letter-spacing: 0.5px; }

  @media (max-width: 700px) {
    body { padding: 24px 16px; }
    .cards { grid-template-columns: 1fr; }
    .card { border-left: none; border-top: 1px solid var(--line); }
    .card:first-child { border-top: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RCSL 2026 · Inscripciones</h1>
    <div class="subtitle">Estado de pagos y comprobantes</div>
    <div class="updated">Última actualización: <span id="updated">—</span></div>
  </header>

  <div id="config-hint" class="config-hint" style="display:none">
    Sin datos. Generar localmente con <code>python insumos\build_master.py</code> (los datos no se publican).
  </div>

  <div class="cards" id="cards"></div>

  <div class="progress">
    <h2>Progreso</h2>
    <div class="bar" id="bar"></div>
    <div class="legend">
      <span><span class="dot" style="background:#FF6B6B"></span>Pagado</span>
      <span><span class="dot" style="background:#ececec"></span>Pendiente</span>
    </div>
  </div>

  <div class="controls">
    <input type="text" id="search" placeholder="Buscar nombre, email, afiliación...">
    <select id="filter-status">
      <option value="all">Todos los estados</option>
      <option value="paid">Pagado</option>
      <option value="pending">Pendiente</option>
    </select>
    <select id="filter-cat">
      <option value="all">Todas las categorías</option>
    </select>
    <span class="row-count" id="row-count"></span>
  </div>

  <div id="table-wrap">
    <div class="empty">Cargando datos...</div>
  </div>

  <footer>RCSL 2026 · Dashboard interno · UDP</footer>
</div>

<script src="data.js" onerror="window._noData = true"></script>
<script>
const TRUTHY = new Set(['si','sí','yes','y','true','1','x','✓','✔']);
const isYes = v => v && TRUTHY.has(String(v).trim().toLowerCase());

function classify(r) {
  // El voucher es la prueba del pago: tener voucher = pagado
  return isYes(r.voucher_subido) ? 'paid' : 'pending';
}

const STATUS_LABEL = {
  paid:    { txt: 'Pagado',    cls: 'yes' },
  pending: { txt: 'Pendiente', cls: 'no' }
};

let allRows = [];
let sortKey = null;
let sortDir = 1;

function render() {
  const total = allRows.length;
  const counts = { paid:0, pending:0 };
  for (const r of allRows) counts[r._status]++;

  const cards = [
    { label: 'Total',    num: total, cls: 'neutral' },
    { label: 'Pagado',   num: counts.paid, cls: 'ok',
      pct: total ? `${Math.round(counts.paid/total*100)}% del total` : '' },
    { label: 'Pendiente', num: counts.pending, cls: 'err',
      pct: total ? `${Math.round(counts.pending/total*100)}% por inscribirse` : '' }
  ];
  document.getElementById('cards').innerHTML = cards.map(c => `
    <div class="card ${c.cls}">
      <div class="label">${c.label}</div>
      <div class="num">${c.num}</div>
      ${c.pct ? `<div class="pct">${c.pct}</div>` : ''}
    </div>
  `).join('');

  if (total > 0) {
    const pct = k => (counts[k] / total) * 100;
    document.getElementById('bar').innerHTML = `
      <div class="bar-seg ok" style="width:${pct('paid')}%" title="Pagado: ${counts.paid}"></div>
    `;
  }

  // categorías
  const cats = Array.from(new Set(allRows.map(r => (r.categoria || '').trim()).filter(Boolean)));
  const catSel = document.getElementById('filter-cat');
  const cur = catSel.value;
  catSel.innerHTML = '<option value="all">Todas las categorías</option>' +
    cats.map(c => `<option value="${c}">${c}</option>`).join('');
  if (cats.includes(cur)) catSel.value = cur;

  renderTable();
}

function renderTable() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const fStatus = document.getElementById('filter-status').value;
  const fCat = document.getElementById('filter-cat').value;

  let rows = allRows.slice();
  if (q) rows = rows.filter(r =>
    (r.nombre || '').toLowerCase().includes(q) ||
    (r.email  || '').toLowerCase().includes(q) ||
    (r.afiliacion || '').toLowerCase().includes(q));
  if (fStatus !== 'all') rows = rows.filter(r => r._status === fStatus);
  if (fCat !== 'all')    rows = rows.filter(r => (r.categoria || '') === fCat);

  if (sortKey) {
    rows.sort((a,b) => {
      const av = String(a[sortKey] ?? '');
      const bv = String(b[sortKey] ?? '');
      return av.localeCompare(bv) * sortDir;
    });
  }

  document.getElementById('row-count').textContent = `${rows.length} de ${allRows.length}`;

  const wrap = document.getElementById('table-wrap');
  if (rows.length === 0) {
    wrap.innerHTML = '<div class="empty">Sin resultados</div>';
    return;
  }
  wrap.innerHTML = `
    <table>
      <thead>
        <tr>
          <th data-sort="nombre">Nombre</th>
          <th data-sort="email">Email</th>
          <th data-sort="pais">País</th>
          <th data-sort="submission_type">Tipo</th>
          <th data-sort="categoria">Categoría</th>
          <th data-sort="_status">Estado pago</th>
          <th data-sort="fecha_inscripcion">Fecha insc.</th>
          <th>Voucher</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => {
          const st = STATUS_LABEL[r._status];
          return `<tr>
            <td>${r.nombre || '—'}</td>
            <td>${r.email || '—'}</td>
            <td>${r.pais || '—'}</td>
            <td>${r.submission_type ? `<span class="pill gray">${r.submission_type}</span>` : '—'}</td>
            <td>${r.categoria || '—'}</td>
            <td><span class="pill ${st.cls}">${st.txt}</span></td>
            <td>${(r.fecha_inscripcion || '').split(' GMT')[0] || '—'}</td>
            <td>${
              r.voucher_local
                ? `<a class="voucher" href="../../insumos/vouchers/${encodeURIComponent(r.voucher_local)}" target="_blank">ver →</a>`
                : (r.voucher_url ? `<a class="voucher" href="${r.voucher_url}" target="_blank">drive →</a>` : '—')
            }</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;

  wrap.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (sortKey === key) sortDir = -sortDir;
      else { sortKey = key; sortDir = 1; }
      renderTable();
    });
  });
}

function init() {
  if (typeof window.RCSL_DATA === 'undefined') {
    document.getElementById('config-hint').style.display = 'block';
    document.getElementById('table-wrap').innerHTML = '<div class="empty">Sin datos. Generá <code>data.js</code> con build_master.py.</div>';
    return;
  }
  allRows = window.RCSL_DATA.slice();
  allRows.forEach(r => r._status = classify(r));
  document.getElementById('updated').textContent =
    window.RCSL_UPDATED ? new Date(window.RCSL_UPDATED).toLocaleString('es-CL') : '—';
  render();
}

document.getElementById('search').addEventListener('input', renderTable);
document.getElementById('filter-status').addEventListener('change', renderTable);
document.getElementById('filter-cat').addEventListener('change', renderTable);

init();
</script>
</body>
</html>
